name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - uses: pnpm/action-setup@v6
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: pnpm build
            - run: docker compose -f deploy/compose.yaml config --quiet
            - run: docker compose -f deploy/compose.yaml build runtime
              env:
                  DSH_OPENSHELL_RUNTIME_IMAGE: dsh-sandbox-openshell-runtime:ci
